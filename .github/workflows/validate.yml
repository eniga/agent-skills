name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Frontmatter, required sections, the 200-line budget, self-containment,
      # and the Operating contract matching docs/operating-contract.md.
      - name: Check skills
        run: node .github/scripts/check-skills.mjs

      # The checker's own behavior is pinned by tests — a broken validator
      # silently passes malformed skills.
      - name: Run checker tests
        run: node --test .github/scripts/*.test.mjs

      # The install path the README advertises must actually install every
      # skill. A skill with broken frontmatter silently disappears here.
      - name: Check every skill installs
        run: |
          mkdir -p /tmp/install-check
          cd /tmp/install-check
          npx -y skills@latest add "$GITHUB_WORKSPACE" \
            --skill '*' --agent claude-code -y --copy --json > result.json
          node -e '
            const fs = require("fs");
            const results = JSON.parse(fs.readFileSync("/tmp/install-check/result.json", "utf8"));
            const installed = results
              .filter(r => r.status === "installed")
              .map(r => r.name);
            const onDisk = fs
              .readdirSync(process.env.GITHUB_WORKSPACE + "/skills", { withFileTypes: true })
              .filter(d => d.isDirectory())
              .map(d => d.name);
            const missing = onDisk.filter(n => !installed.includes(n));
            if (missing.length) {
              console.error("Did not install: " + missing.join(", "));
              console.error(JSON.stringify(results, null, 2));
              process.exit(1);
            }
            console.log("All " + onDisk.length + " skills installed.");
          '

  # The pack ships the gate it asks consumers to run, so it runs it too.
  # There is no dependency job: this repository has no manifest or lockfile.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for secrets (gitleaks v8.30.1)
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner
